name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bench example hook tool
      - run: dart analyze --fatal-infos
      - run: dart test
      # The web build has no native decoders. These tests check that WAV and
      # the helpers give the VM results in Chrome and that the native entry
      # points throw UnsupportedError.
      - if: matrix.os == 'ubuntu-latest'
        run: dart test -p chrome -c dart2js -c dart2wasm
