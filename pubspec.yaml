name: audio_decode
description: >-
  Decode MP3 and Ogg Vorbis to raw PCM in Dart, over FFI. Compiles stb_vorbis
  and minimp3 from source: self-contained, pure-Dart friendly, no platform
  plugins or prebuilt binaries.
version: 1.3.6
repository: https://github.com/Yusufihsangorgel/audio_decode
issue_tracker: https://github.com/Yusufihsangorgel/audio_decode/issues

topics:
  - audio
  - mp3
  - vorbis
  - pcm
  - ffi

screenshots:
  - description: |-
      Compressed bytes in, PCM samples out: the first bytes pick stb_vorbis or minimp3, which yields interleaved 16-bit samples.
    path: doc/architecture.png
  - description: |-
      Decoding one Ogg file in process versus through ffmpeg: every ffmpeg bar starts with the same 24.8 ms of process startup.
    path: doc/benchmark.png

environment:
  sdk: ^3.10.0

# Android and iOS run the decode test on an emulator and a simulator in
# flutter-compat.yaml. Linux, macOS and Windows run the Dart VM tests. The
# package compiles for the web, but Ogg Vorbis and MP3 decoding throws
# UnsupportedError there. Web is not listed for that reason.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  code_assets: '>=1.2.1 <3.0.0'
  native_toolchain_c: '>=0.19.2 <0.20.0'

dev_dependencies:
  # Lower bounds that `dart pub downgrade` can build and run. test 1.25 and
  # 1.26 allow analyzer versions before 6.4, which allow watcher 1.0.0. That
  # watcher implements FileSystemEvent, which is sealed since Dart 3.1.
  test: ^1.27.0
  # The test_core version that package:test pins allows frontend_server_client
  # 3.2, which starts frontend_server.dart.snapshot. 64-bit SDKs ship only the
  # AOT snapshot.
  frontend_server_client: ^4.0.0
  lints: ^6.0.0
